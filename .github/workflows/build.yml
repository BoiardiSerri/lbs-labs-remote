name: Build installer (macOS DMG + Windows Setup)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare i file nella pagina "Releases"

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Mac con chip Apple (M1/M2/M3/M4)
            arch: AppleSilicon
          - runner: macos-15-intel    # Mac con processore Intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Icone
        run: python packaging/build_icons.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/lbs_labs_remote.spec
      - name: Firma ad-hoc
        run: codesign --force --deep --sign - "dist/LBS Labs Remote.app"
      - name: Autotest dell'app impacchettata
        run: |
          "dist/LBS Labs Remote.app/Contents/MacOS/LBSLabsRemote" --selftest selftest.txt || (cat selftest.txt; exit 1)
          cat selftest.txt
      - name: DMG
        run: bash packaging/macos/make_dmg.sh "LBS-Labs-Remote-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: LBS-Labs-Remote-macOS-${{ matrix.arch }}
          path: LBS-Labs-Remote-macOS-${{ matrix.arch }}.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Icone
        run: python packaging/build_icons.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/lbs_labs_remote.spec
      - name: Autotest dell'app impacchettata
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\LBSLabsRemote\LBSLabsRemote.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = python -c "import lbsremote; print(lbsremote.__version__)"
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: LBS-Labs-Remote-Windows-Setup
          path: packaging/windows/Output/LBS-Labs-Remote-Windows-Setup.exe

  # Pubblica i file nella pagina Releases del repository (scaricabili dal browser)
  release:
    needs: [macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import lbsremote; print(lbsremote.__version__)")
          TAG="v$VERSION"
          ls -la artifacts
          NOTES="Scarica il file per il tuo computer:
          - Mac con chip Apple (M1/M2/M3/M4): LBS-Labs-Remote-macOS-AppleSilicon.dmg
          - Mac con processore Intel: LBS-Labs-Remote-macOS-Intel.dmg
          - Windows: LBS-Labs-Remote-Windows-Setup.exe

          Build del $(date -u '+%d/%m/%Y %H:%M') UTC (commit ${GITHUB_SHA::7})."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "LBS Labs Remote $VERSION" --notes "$NOTES"
          fi
          gh release upload "$TAG" artifacts/* --clobber
