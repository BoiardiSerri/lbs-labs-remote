name: Build installer (macOS DMG + Windows Setup)

on:
  push:
    branches: [main, mobile]    # il ramo "mobile" compila e prova tutto, ma non pubblica
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare i file nella pagina "Releases"

jobs:
  # Un'unica app Universale (Intel + Apple Silicon nativo), costruita sul Mac Intel di GitHub
  macos:
    runs-on: macos-15-intel
    env:
      PYVER: "3.12.10"     # ultimo Python 3.12 con installer Universale ufficiale
      LBS_TARGET_ARCH: universal2
    steps:
      - uses: actions/checkout@v4
      - name: Python Universale (python.org)
        run: |
          curl -fsSL -o python.pkg "https://www.python.org/ftp/python/${PYVER}/python-${PYVER}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          PY="/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12"
          lipo -archs "$(dirname "$(readlink -f "$PY")")/../Resources/Python.app/Contents/MacOS/Python" || true
          "$PY" -m venv venv
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
      - name: Pillow Universale (fusione delle versioni Intel e Apple Silicon)
        run: |
          python -m pip install --upgrade pip delocate
          COMMON="--only-binary=:all: --no-deps --python-version 3.12 --implementation cp --abi cp312"
          python -m pip download pillow $COMMON -d wh/x86 \
            --platform macosx_10_13_x86_64 --platform macosx_10_15_x86_64 --platform macosx_11_0_x86_64
          VER=$(ls wh/x86 | sed -E 's/^pillow-([^-]+)-.*/\1/')
          python -m pip download "pillow==$VER" $COMMON -d wh/arm --platform macosx_11_0_arm64
          delocate-merge wh/x86/*.whl wh/arm/*.whl -w wh/fused
          ls wh/fused
          python -m pip install wh/fused/*.whl
      - name: Dipendenze
        run: python -m pip install -r requirements.txt pyinstaller dmgbuild
      - name: Grafica (icone, sfondo DMG)
        run: python packaging/build_icons.py
      - name: PyInstaller (universal2)
        run: pyinstaller --noconfirm --clean packaging/lbs_labs_remote.spec
      - name: Verifica compatibilità Intel + Apple Silicon
        run: bash packaging/macos/check_universal.sh "dist/LBS Labs Remote.app"
      # Firma con un'identità stabile (packaging/macos/lbs-labs-codesign.p12, nel repository privato):
      # macOS lega i permessi "Registrazione schermo" e "Accessibilità" alla firma dell'app. Con la firma
      # "ad-hoc" cambiava a ogni build e i permessi concessi a una versione non valevano per la successiva.
      - name: Firma con l'identità stabile LBS Labs
        run: |
          APP="dist/LBS Labs Remote.app"
          KC="$RUNNER_TEMP/lbs-sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import packaging/macos/lbs-labs-codesign.p12 -k "$KC" -P lbslabsremote -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
          HASH=$(security find-identity -p codesigning "$KC" | grep "LBS Labs Remote Code Signing" | head -1 | awk '{print $2}')
          test -n "$HASH"
          codesign --force --deep --sign "$HASH" --keychain "$KC" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Identifier|Authority|Signature|TeamIdentifier"
          echo "--- requisito di firma:"
          REQ=$(codesign -d -r- "$APP" 2>&1 | grep designated)
          echo "$REQ"
          # deve dipendere dall'identificativo e dal certificato, non da un hash del codice (che cambia a ogni build)
          # (un certificato proprio è la radice di se stesso: compare "certificate root" invece di "leaf")
          echo "$REQ" | grep -Eq 'certificate (leaf|root) = H' || { echo "ERRORE: firma non stabile"; exit 1; }
          echo "$REQ" | grep -q 'cdhash' && { echo "ERRORE: la firma dipende dall'hash del codice"; exit 1; }
          echo "firma stabile OK"
      - name: Autotest dell'app impacchettata (Intel)
        run: |
          "dist/LBS Labs Remote.app/Contents/MacOS/LBSLabsRemote" --selftest selftest.txt || (cat selftest.txt; exit 1)
          cat selftest.txt
      - name: DMG
        run: bash packaging/macos/make_dmg.sh "LBS-Labs-Remote-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: LBS-Labs-Remote-macOS
          path: LBS-Labs-Remote-macOS.dmg

  # Verifica facoltativa su un Mac con chip Apple: se GitHub non ne ha di disponibili
  # viene saltata senza bloccare la pubblicazione.
  verify-apple-silicon:
    needs: macos
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LBS-Labs-Remote-macOS
      - name: Autotest nativo Apple Silicon
        run: |
          uname -m
          hdiutil attach LBS-Labs-Remote-macOS.dmg -mountpoint /tmp/lbs -nobrowse
          cp -R "/tmp/lbs/LBS Labs Remote.app" /tmp/
          "/tmp/LBS Labs Remote.app/Contents/MacOS/LBSLabsRemote" --selftest selftest.txt || (cat selftest.txt; exit 1)
          cat selftest.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Grafica (icone, immagini dell'installer)
        run: python packaging/build_icons.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/lbs_labs_remote.spec
      - name: Autotest dell'app impacchettata
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\LBSLabsRemote\LBSLabsRemote.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          # programma di installazione di Microsoft Edge WebView2 (usato solo se manca sul PC)
          try {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging\windows\MicrosoftEdgeWebview2Setup.exe
          } catch { Write-Warning "WebView2 bootstrapper non scaricato: $_" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = python -c "import lbsremote; print(lbsremote.__version__)"
          # tema scuro della procedura se la versione di Inno Setup lo supporta, altrimenti normale
          & $iscc "/DAppVersion=$version" "/DWizStyle=modern dark" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "stile scuro non supportato: compilo con lo stile normale"
            & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LBS-Labs-Remote-Windows-Setup
          path: packaging/windows/Output/LBS-Labs-Remote-Windows-Setup.exe

  # ------------------------------------------------------------------ Android (APK firmato)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Interfaccia e stile LBS nell'app
        run: |
          python -m pip install pillow
          python packaging/mobile/prepare_assets.py android
      - name: Test del codice di rete (JVM) contro l'agente di prova
        run: |
          sudo apt-get install -y libandroid-json-org-java >/dev/null
          python tools/fake_agent.py --port 5970 --seconds 120 > fake_agent.log 2>&1 &
          sleep 2
          mkdir -p jtest
          javac -d jtest -cp /usr/share/java/json-android.jar android/app/src/main/java/com/lbslabs/remote/{Protocol,NetSession,Discovery,AppCore}.java android/test/CoreTest.java
          java -cp jtest:/usr/share/java/json-android.jar CoreTest ok 127.0.0.1 | tee core_test.log
          grep -q "RESULT PASS" core_test.log
          grep -c "INPUT" fake_agent.log
          java -cp jtest:/usr/share/java/json-android.jar CoreTest fail 127.0.0.1 5999 | grep RESULT
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compila e firma l'APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Verifica la firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --verbose --print-certs "$APK" | head -8
          cp "$APK" LBS-Labs-Remote-Android.apk
          ls -la LBS-Labs-Remote-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LBS-Labs-Remote-Android
          path: LBS-Labs-Remote-Android.apk

  # Prova completa sull'emulatore Android: l'app si collega all'agente di prova, riceve i frame
  # e un tocco sullo schermo arriva all'agente come clic. Non blocca la pubblicazione.
  android-e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: LBS-Labs-Remote-Android
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Agente di prova
        run: |
          python -m pip install pillow
          python tools/fake_agent.py --port 5970 --seconds 900 > fake_agent.log 2>&1 &
          sleep 2; cat fake_agent.log
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: bash tools/android_e2e.sh LBS-Labs-Remote-Android.apk fake_agent.log
      - name: Esito
        if: always()
        run: cat fake_agent.log | tail -30

  # ------------------------------------------------------------------ iPad / iPhone (.ipa non firmato)
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interfaccia e stile LBS nell'app
        run: |
          python -m pip install pillow
          python packaging/mobile/prepare_assets.py ios
      - name: Progetto Xcode (XcodeGen)
        run: |
          brew install xcodegen
          export APP_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('lbsremote/__init__.py').read()).group(1))")
          export BUILD_NUMBER=${{ github.run_number }}
          cd ios && xcodegen generate
      - name: Compila per iPad e iPhone (senza firma)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project LBSLabsRemote.xcodeproj -scheme LBSLabsRemote -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build.log | tail -60
      - name: Crea il file .ipa e controlla il contenuto
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/LBSLabsRemote.app
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleDisplayName|NSLocalNetwork|MinimumOSVersion|UIDeviceFamily" 
          ls "$APP/www" "$APP/www/lbs"
          test -f "$APP/www/lbs/font/BarlowSemiCondensed-SemiBold.ttf"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry LBS-Labs-Remote-iPad.ipa Payload
          ls -la LBS-Labs-Remote-iPad.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LBS-Labs-Remote-iPad
          path: LBS-Labs-Remote-iPad.ipa

  # Prova sul simulatore iPad: l'app si collega all'agente di prova, riceve i frame e invia un clic.
  # Non blocca la pubblicazione.
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interfaccia, progetto e compilazione per il simulatore
        run: |
          set -o pipefail
          python -m pip install pillow
          python packaging/mobile/prepare_assets.py ios
          brew install xcodegen
          export APP_VERSION=0.0.0 BUILD_NUMBER=1
          cd ios && xcodegen generate
          xcodebuild -project LBSLabsRemote.xcodeproj -scheme LBSLabsRemote -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Agente di prova
        run: |
          python tools/fake_agent.py --port 5970 --seconds 600 > fake_agent.log 2>&1 &
          sleep 2; cat fake_agent.log
      - name: Prova sul simulatore
        run: bash tools/ios_e2e.sh ios/build/Build/Products/Debug-iphonesimulator/LBSLabsRemote.app fake_agent.log
      - name: Esito
        if: always()
        run: tail -30 fake_agent.log

  # Pubblica i file nella pagina Releases del repository (scaricabili dal browser)
  release:
    needs: [macos, windows, android, ios]
    # si pubblica solo da main e solo se tutti i pacchetti sono riusciti: mai una versione a metà
    if: ${{ github.ref == 'refs/heads/main' && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import lbsremote; print(lbsremote.__version__)")
          TAG="v$VERSION"
          ls -la artifacts
          NOTES="Download the file for your device:
          - Mac (all models: Apple silicon M1/M2/M3/M4 and Intel, Universal app): LBS-Labs-Remote-macOS.dmg
          - Windows: LBS-Labs-Remote-Windows-Setup.exe
          - Android phone or tablet: LBS-Labs-Remote-Android.apk (allow installing from this source when asked)
          - iPad / iPhone: LBS-Labs-Remote-iPad.ipa (not signed: install it with Sideloadly or AltStore, see README)

          Mac and Windows can control and be controlled. Android and iPad are viewers: they control Mac and Windows computers.

          Built on $(date -u '+%Y-%m-%d %H:%M') UTC (commit ${GITHUB_SHA::7})."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "LBS Labs Remote $VERSION" --notes "$NOTES"
          fi
          gh release upload "$TAG" artifacts/* --clobber
          # rimuove file di versioni precedenti che non esistono più
          for old in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            [ -e "artifacts/$old" ] || gh release delete-asset "$TAG" "$old" -y
          done
