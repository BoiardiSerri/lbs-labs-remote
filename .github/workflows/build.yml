name: Build installer (macOS DMG + Windows Setup)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Mac con chip Apple (M1/M2/M3/M4)
            arch: AppleSilicon
          - runner: macos-15-intel    # Mac con processore Intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Icone
        run: python packaging/build_icons.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/remotelan.spec
      - name: Firma ad-hoc
        run: codesign --force --deep --sign - dist/RemoteLAN.app
      - name: Autotest dell'app impacchettata
        run: |
          dist/RemoteLAN.app/Contents/MacOS/RemoteLAN --selftest selftest.txt || (cat selftest.txt; exit 1)
          cat selftest.txt
      - name: DMG
        run: bash packaging/macos/make_dmg.sh "RemoteLAN-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteLAN-macOS-${{ matrix.arch }}
          path: RemoteLAN-macOS-${{ matrix.arch }}.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Icone
        run: python packaging/build_icons.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/remotelan.spec
      - name: Autotest dell'app impacchettata
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\RemoteLAN\RemoteLAN.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = python -c "import remotelan; print(remotelan.__version__)"
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteLAN-Windows-Setup
          path: packaging/windows/Output/RemoteLAN-Windows-Setup.exe
